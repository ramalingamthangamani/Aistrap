[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aistrap"
description = "Generate clean, ready-to-use AI/ML project structures from templates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dynamic = ["version"]
authors = [{ name = "aistrap contributors" }]
keywords = ["ai", "ml", "cli", "scaffold", "template", "generator", "rag", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
# The CLI itself has no runtime dependencies - it only uses the standard library.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "build>=1.0",
]
# Dependencies of the generated projects. Installing these lets the test suite
# run the templates end to end instead of skipping them.
templates = [
    "fastapi>=0.110",
    "httpx>=0.26",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pillow>=10.0",
]

[project.scripts]
aistrap = "aistrap.cli:run"

[project.urls]
Repository = "https://github.com/ramalingamthangamani/Aistrap"
Issues = "https://github.com/ramalingamthangamani/Aistrap/issues"
Changelog = "https://github.com/ramalingamthangamani/Aistrap/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "aistrap.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["aistrap*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
aistrap = ["templates/**/*", "templates/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
# Template files are rendered, not imported - they are not valid modules on their own.
extend-exclude = ["src/aistrap/templates", "examples/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
